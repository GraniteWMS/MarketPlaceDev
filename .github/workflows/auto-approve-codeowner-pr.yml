name: Auto-approve PR by Codeowner

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR author is codeowner
        id: check-codeowner
        # Everything attacker-influenced (branch names, author, file paths) is passed
        # via env or read straight from git, never interpolated into the script text.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "PR Author: $PR_AUTHOR"
          echo "Checking CODEOWNERS file..."

          # Read CODEOWNERS file
          if [ ! -f ".github/CODEOWNERS" ]; then
            echo "is_codeowner=false" >> "$GITHUB_OUTPUT"
            echo "CODEOWNERS file not found"
            exit 0
          fi

          git fetch origin -- "$BASE_REF"

          IS_CODEOWNER=false

          # Check each changed file (NUL-delimited so odd characters in paths are safe)
          while IFS= read -r -d '' file; do
            [ -z "$file" ] && continue

            echo "Checking file: $file"
            
            # Get the directory path
            dir_path=$(dirname "$file")
            
            # Check CODEOWNERS for matching patterns
            while IFS= read -r line; do
              # Skip empty lines and comments
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              
              # Extract pattern and owners
              pattern=$(echo "$line" | awk '{print $1}')
              owners=$(echo "$line" | awk '{$1=""; print $0}' | xargs)
              
              # Remove trailing /* from pattern for directory matching
              pattern_dir="${pattern%/*}"
              
              # Check if the file matches the pattern
              if [[ "$file" == $pattern_dir/* ]] || [[ "$file" == $pattern ]]; then
                echo "File $file matches pattern $pattern with owners: $owners"
                
                # Check if PR author is in the owners list. Compare whole tokens,
                # case-insensitively (logins are): a substring match would let a user
                # named "josh" be treated as the owner "@josh-m".
                author_is_owner=false
                read -ra owner_list <<< "$owners"
                for owner in "${owner_list[@]}"; do
                  if [[ "${owner,,}" == "@${PR_AUTHOR,,}" ]]; then
                    author_is_owner=true
                    break
                  fi
                done

                if [ "$author_is_owner" = "true" ]; then
                  echo "✅ PR author $PR_AUTHOR is a codeowner of $file"
                  IS_CODEOWNER=true
                  break 2
                fi
              fi
            done < .github/CODEOWNERS
          done < <(git diff --name-only -z "origin/${BASE_REF}...${HEAD_SHA}" --)

          echo "is_codeowner=$IS_CODEOWNER" >> "$GITHUB_OUTPUT"
          
          if [ "$IS_CODEOWNER" = "true" ]; then
            echo "✅ PR author is a codeowner of at least one changed file"
          else
            echo "❌ PR author is not a codeowner of any changed files"
          fi

      - name: Approve PR
        if: steps.check-codeowner.outputs.is_codeowner == 'true'
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
