{{#if Scanned}}

  {{
    "EXEC GetLookupDataSimple
      @value = @Scanned"
    | dbSelect({Scanned})
    | to => returnedData
  }}

  <div class="row g-0">
    <small class="col">Count</small>
    <header id="Count" class="col">
      {{returnedData.Count}}
    </header>
  </div>

  <div class="row g-0">
    <small class="col">Total Qty</small>
    <header class="col">
      {{returnedData.reduce((acc, row) => acc + row.Qty, 0)}}
    </header>
  </div>

  <div class="table table-responsive-sm">
    {{returnedData | basicTable({enableSearch:true}) }}
  </div>

{{/if}}
